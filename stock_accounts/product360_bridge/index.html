<!doctype html><html><head><meta charset="utf-8"></head><body style="font:14px Arial;color:#23443b"><button id="connect" style="padding:14px 22px;border:0;border-radius:6px;color:white;background:#087e78">Open Product 360 ↗</button><p id="status">Keep this connection window open.</p><script>
let hub='',popup=null,nonce='',sent='';const out=data=>parent.postMessage({isStreamlitMessage:true,...data},'*');
window.addEventListener('message',e=>{let m=e.data;if(!m||typeof m!=='object')return;if(m.type==='streamlit:render'&&e.source===parent){hub=m.args.hub;const r=m.args.result;if(r&&popup&&!popup.closed&&r.nonce===nonce&&JSON.stringify(r)!==sent){popup.postMessage(r,hub);sent=JSON.stringify(r);document.querySelector('#status').textContent=r.type==='p360-error'?r.error:'Latest matching workbook records sent.'}out({type:'streamlit:setFrameHeight',height:130});return}if(e.origin!==hub||e.source!==popup||m.type!=='p360-fetch'||m.nonce!==nonce)return;out({type:'streamlit:setComponentValue',value:{action:'fetch',nonce,skus:m.skus,requestId:m.requestId},dataType:'json'});document.querySelector('#status').textContent='Reading the latest uploaded workbook…'});
document.querySelector('#connect').onclick=()=>{if(!hub)return;nonce=Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('');const origin=new URL(document.referrer||location.href).origin;popup=window.open(hub+'/#commercial?connect='+nonce+'&source='+encodeURIComponent(origin),'p360-'+nonce);document.querySelector('#status').textContent=popup?'In Product 360, select Fetch latest workbook.':'Allow this connection to open a new tab.'};
out({type:'streamlit:componentReady',apiVersion:1});
</script></body></html>
